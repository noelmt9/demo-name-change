<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Sign-In</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f5f5f5;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4285F4;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <p>Signing in with Google...</p>
        <p id="status" style="font-size: 0.9rem; color: #666; margin-top: 1rem;"></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithRedirect, getRedirectResult } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // Get Firebase config from URL parameters (passed by Streamlit)
        const urlParams = new URLSearchParams(window.location.search);
        const apiKey = urlParams.get('apiKey');
        const authDomain = urlParams.get('authDomain');
        const projectId = urlParams.get('projectId');
        const appId = urlParams.get('appId');
        // Get return URL - if in popup, use parent window's origin
        const returnUrl = urlParams.get('returnUrl') || (window.opener ? window.opener.location.origin : window.location.origin);

        if (!apiKey || !authDomain) {
            document.getElementById('status').textContent = 'Error: Missing Firebase configuration';
            document.getElementById('status').style.color = '#b00020';
            throw new Error('Missing Firebase configuration');
        }

        const firebaseConfig = {
            apiKey: apiKey,
            authDomain: authDomain,
            projectId: projectId,
            appId: appId
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const statusEl = document.getElementById('status');

        function setStatus(text) {
            statusEl.textContent = text;
        }

        // Handle redirect callback - if we returned from Google sign-in
        async function handleRedirect() {
            try {
                setStatus('Completing sign-in...');
                const result = await getRedirectResult(auth);
                
                if (result && result.user) {
                    setStatus('Getting authentication token...');
                    const token = await result.user.getIdToken();
                    
                    if (!token) {
                        throw new Error('No token received');
                    }

                    setStatus('Redirecting back to app...');
                    // Send message to parent window (if in popup) or redirect directly
                    if (window.opener) {
                        // We're in a popup - send message to parent
                        window.opener.postMessage({
                            type: 'FIREBASE_AUTH_SUCCESS',
                            token: token
                        }, '*'); // In production, specify exact origin
                        window.close();
                    } else {
                        // Direct navigation - redirect back to Streamlit with the token
                        const returnUrlObj = new URL(returnUrl);
                        returnUrlObj.searchParams.set('firebase_id_token', token);
                        window.location.href = returnUrlObj.toString();
                    }
                } else {
                    // No redirect result - initiate sign-in
                    setStatus('Redirecting to Google...');
                    await signInWithRedirect(auth, provider);
                }
            } catch (error) {
                console.error('Firebase auth error:', error);
                setStatus(`Error: ${error.message || error.code || 'Unknown error'}`);
                document.getElementById('status').style.color = '#b00020';
                
                // Show helpful error message
                if (error.code === 'auth/unauthorized-domain') {
                    setStatus(`Unauthorized domain. Add "${window.location.host}" to Firebase Authorized Domains.`);
                }
            }
        }

        // Start the auth flow
        handleRedirect();
    </script>
</body>
</html>
