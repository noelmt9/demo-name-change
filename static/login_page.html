<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Login / Register</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .container {
        background: white;
        padding: 2.5rem;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        width: 100%;
        max-width: 420px;
      }
      h1 {
        text-align: center;
        margin-top: 0;
        margin-bottom: 0.5rem;
        color: #1f2937;
        font-size: 1.75rem;
      }
      .subtitle {
        text-align: center;
        color: #6b7280;
        margin-bottom: 2rem;
        font-size: 0.9rem;
      }
      .tabs {
        display: flex;
        border-bottom: 2px solid #e5e7eb;
        margin-bottom: 1.5rem;
      }
      .tab {
        flex: 1;
        padding: 0.75rem 1rem;
        background: none;
        border: none;
        cursor: pointer;
        font-size: 1rem;
        color: #6b7280;
        font-weight: 500;
        transition: all 0.2s;
        border-bottom: 2px solid transparent;
        margin-bottom: -2px;
      }
      .tab:hover {
        color: #1f2937;
      }
      .tab.active {
        color: #667eea;
        border-bottom-color: #667eea;
      }
      .tab-content {
        display: none;
      }
      .tab-content.active {
        display: block;
      }
      .form-group {
        margin-bottom: 1.25rem;
      }
      label {
        display: block;
        margin-bottom: 0.5rem;
        color: #374151;
        font-size: 0.9rem;
        font-weight: 500;
      }
      input[type="text"],
      input[type="email"],
      input[type="password"] {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 1rem;
        transition: border-color 0.2s;
      }
      input:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }
      .optional {
        color: #6b7280;
        font-weight: normal;
      }
      .required {
        color: #ef4444;
      }
      button[type="submit"],
      .google-btn {
        width: 100%;
        padding: 0.75rem;
        border: none;
        border-radius: 6px;
        font-size: 1rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
        margin-bottom: 0.75rem;
      }
      button[type="submit"] {
        background: #667eea;
        color: white;
      }
      button[type="submit"]:hover {
        background: #5568d3;
      }
      button[type="submit"]:disabled {
        background: #9ca3af;
        cursor: not-allowed;
      }
      .google-btn {
        background: #4285F4;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      }
      .google-btn:hover {
        background: #357ae8;
      }
      .divider {
        text-align: center;
        margin: 1.5rem 0;
        color: #6b7280;
        font-size: 0.9rem;
        position: relative;
      }
      .divider::before,
      .divider::after {
        content: '';
        position: absolute;
        top: 50%;
        width: 45%;
        height: 1px;
        background: #e5e7eb;
      }
      .divider::before {
        left: 0;
      }
      .divider::after {
        right: 0;
      }
      .switch-tab {
        text-align: center;
        margin-top: 1.5rem;
        padding-top: 1.5rem;
        border-top: 1px solid #e5e7eb;
      }
      .switch-tab button {
        background: none;
        border: none;
        color: #667eea;
        cursor: pointer;
        font-size: 0.9rem;
        text-decoration: underline;
      }
      .switch-tab button:hover {
        color: #5568d3;
      }
      .message {
        padding: 0.75rem;
        border-radius: 6px;
        margin-bottom: 1rem;
        font-size: 0.9rem;
      }
      .message.error {
        background: #fee2e2;
        color: #991b1b;
        border: 1px solid #fecaca;
      }
      .message.success {
        background: #d1fae5;
        color: #065f46;
        border: 1px solid #a7f3d0;
      }
      .message.info {
        background: #dbeafe;
        color: #1e40af;
        border: 1px solid #bfdbfe;
      }
      .loading {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid #ffffff;
        border-radius: 50%;
        border-top-color: transparent;
        animation: spin 0.8s linear infinite;
        margin-right: 0.5rem;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🔐 Authentication</h1>
      <p class="subtitle">Please login or register to access the VAPI Assistant Manager</p>

      <div class="tabs">
        <button class="tab active" data-tab="register">📝 Register</button>
        <button class="tab" data-tab="login">🔑 Login</button>
      </div>

      <!-- Register Tab -->
      <div id="register-tab" class="tab-content active">
        <form id="register-form">
          <div class="form-group">
            <label for="register-name">Name <span class="optional">(Optional)</span></label>
            <input type="text" id="register-name" name="name" placeholder="Your name" />
          </div>
          <div class="form-group">
            <label for="register-email">Email <span class="required">*</span></label>
            <input type="email" id="register-email" name="email" placeholder="your.email@example.com" required />
          </div>
          <div class="form-group">
            <label for="register-password">Password <span class="required">*</span></label>
            <input type="password" id="register-password" name="password" placeholder="At least 6 characters" required minlength="6" />
          </div>
          <div class="form-group">
            <label for="register-password-confirm">Confirm Password <span class="required">*</span></label>
            <input type="password" id="register-password-confirm" name="password_confirm" placeholder="Re-enter password" required minlength="6" />
          </div>
          <button type="submit">Register</button>
        </form>

        <div class="divider">Or continue with</div>
        <button class="google-btn" id="google-register">
          🔵 Continue with Google
        </button>

        <div class="switch-tab">
          <p>Already have an account? <button type="button" onclick="switchTab('login')">Sign in</button></p>
        </div>
      </div>

      <!-- Login Tab -->
      <div id="login-tab" class="tab-content">
        <form id="login-form">
          <div class="form-group">
            <label for="login-email">Email <span class="required">*</span></label>
            <input type="email" id="login-email" name="email" placeholder="your.email@example.com" required />
          </div>
          <div class="form-group">
            <label for="login-password">Password <span class="required">*</span></label>
            <input type="password" id="login-password" name="password" placeholder="Enter your password" required />
          </div>
          <button type="submit">Sign In</button>
        </form>

        <div class="divider">Or continue with</div>
        <button class="google-btn" id="google-login">
          🔵 Continue with Google
        </button>

        <div class="switch-tab">
          <p>Don't have an account? <button type="button" onclick="switchTab('register')">Register</button></p>
        </div>
      </div>

      <div id="message"></div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
      import {
        getAuth,
        GoogleAuthProvider,
        signInWithPopup,
        createUserWithEmailAndPassword,
        signInWithEmailAndPassword,
        updateProfile,
      } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";

      // Firebase configuration
      const firebaseConfig = {
        apiKey: "AIzaSyA6_E7itGE4WB2mu-_W_44xn1dBw6NHvM8",
        authDomain: "vapi-demo-auth.firebaseapp.com",
        projectId: "vapi-demo-auth",
        appId: "1:1089810653158:web:750b0f7399c9ebf9d40027",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const provider = new GoogleAuthProvider();

      // Tab switching
      function switchTab(tabName) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        
        document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');
        document.getElementById(`${tabName}-tab`).classList.add('active');
        clearMessage();
      }

      document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
          const tabName = tab.getAttribute('data-tab');
          switchTab(tabName);
        });
      });

      // Message display
      function showMessage(text, type = 'info') {
        const msgDiv = document.getElementById('message');
        msgDiv.className = `message ${type}`;
        msgDiv.textContent = text;
        msgDiv.style.display = 'block';
      }

      function clearMessage() {
        document.getElementById('message').style.display = 'none';
      }

      // Get return URL
      function getReturnUrl() {
        const u = new URL(window.location.href);
        return u.searchParams.get("return_to") || "https://vapi-assistant-builder.replit.app";
      }

      // Redirect after successful auth
      function redirectWithToken(token) {
        const returnTo = getReturnUrl();
        const back = new URL(returnTo);
        back.searchParams.set("id_token", token);
        window.location.href = back.toString();
      }

      // Google Sign-In
      async function handleGoogleSignIn() {
        try {
          clearMessage();
          const button = event.target;
          const originalText = button.innerHTML;
          button.innerHTML = '<span class="loading"></span>Signing in...';
          button.disabled = true;

          const result = await signInWithPopup(auth, provider);
          const token = await result.user.getIdToken();
          redirectWithToken(token);
        } catch (e) {
          console.error(e);
          showMessage(`${e.code || "error"}: ${e.message || e}`, 'error');
          event.target.disabled = false;
          event.target.innerHTML = '🔵 Continue with Google';
        }
      }

      document.getElementById('google-register').addEventListener('click', handleGoogleSignIn);
      document.getElementById('google-login').addEventListener('click', handleGoogleSignIn);

      // Email/Password Registration
      document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        clearMessage();

        const email = document.getElementById('register-email').value;
        const password = document.getElementById('register-password').value;
        const passwordConfirm = document.getElementById('register-password-confirm').value;
        const name = document.getElementById('register-name').value;

        if (password !== passwordConfirm) {
          showMessage("Passwords do not match", 'error');
          return;
        }

        if (password.length < 6) {
          showMessage("Password must be at least 6 characters long", 'error');
          return;
        }

        try {
          const submitBtn = e.target.querySelector('button[type="submit"]');
          const originalText = submitBtn.textContent;
          submitBtn.disabled = true;
          submitBtn.innerHTML = '<span class="loading"></span>Registering...';

          const userCredential = await createUserWithEmailAndPassword(auth, email, password);
          
          // Update profile with name if provided
          if (name) {
            await updateProfile(userCredential.user, { displayName: name });
          }

          const token = await userCredential.user.getIdToken();
          redirectWithToken(token);
        } catch (error) {
          let errorMsg = "Registration failed";
          if (error.code === 'auth/email-already-in-use') {
            errorMsg = "Email already registered. Please login instead.";
          } else if (error.code === 'auth/weak-password') {
            errorMsg = "Password is too weak. Please use a stronger password.";
          } else if (error.code === 'auth/invalid-email') {
            errorMsg = "Invalid email address.";
          } else {
            errorMsg = error.message || errorMsg;
          }
          showMessage(errorMsg, 'error');
          e.target.querySelector('button[type="submit"]').disabled = false;
          e.target.querySelector('button[type="submit"]').textContent = 'Register';
        }
      });

      // Email/Password Login
      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        clearMessage();

        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;

        try {
          const submitBtn = e.target.querySelector('button[type="submit"]');
          const originalText = submitBtn.textContent;
          submitBtn.disabled = true;
          submitBtn.innerHTML = '<span class="loading"></span>Signing in...';

          const userCredential = await signInWithEmailAndPassword(auth, email, password);
          const token = await userCredential.user.getIdToken();
          redirectWithToken(token);
        } catch (error) {
          let errorMsg = "Login failed";
          if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
            errorMsg = "Invalid email or password.";
          } else if (error.code === 'auth/invalid-email') {
            errorMsg = "Invalid email address.";
          } else {
            errorMsg = error.message || errorMsg;
          }
          showMessage(errorMsg, 'error');
          e.target.querySelector('button[type="submit"]').disabled = false;
          e.target.querySelector('button[type="submit"]').textContent = 'Sign In';
        }
      });
    </script>
  </body>
</html>
